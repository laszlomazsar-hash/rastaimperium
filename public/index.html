<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasta Imperium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            text-align: center;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 1.3rem;
            color: #00d4ff;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        .feature {
            font-size: 0.95rem;
            color: #00d4ff;
            padding: 8px 16px;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            background: rgba(0, 212, 255, 0.05);
        }
        .status {
            margin-top: 50px;
            font-size: 1rem;
            color: #00d4ff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rasta Imperium</h1>
        <p class="subtitle">Sovereign Digital Territory</p>
        <p class="tagline">Deterministic Governance for Civilization-Scale AI</p>
        
        <div class="features">
            <div class="feature">Replayable</div>
            <div class="feature">Auditable</div>
            <div class="feature">Mythic-Technical Architecture</div>
        </div>
        
        <div class="status">
            Core restored. Full experience loading...
        </div>
    </div>
</body>
</html>

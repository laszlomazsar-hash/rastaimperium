name: Python Package

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'evo-v-core/**'
      - 'infra/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements*.txt'


jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      frontend_lane: ${{ steps.filter.outputs.frontend_lane }}
      backend_lane: ${{ steps.filter.outputs.backend_lane }}
      evo_v_core_lane: ${{ steps.filter.outputs.evo_v_core_lane }}
      infra_lane: ${{ steps.filter.outputs.infra_lane }}
      docs_lane: ${{ steps.filter.outputs.docs_lane }}
      shared_impact: ${{ steps.filter.outputs.shared_impact }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend_lane:
              - 'frontend/**'
            backend_lane:
              - 'backend/**'
            evo_v_core_lane:
              - 'evo-v-core/**'
            infra_lane:
              - 'infra/**'
            docs_lane:
              - 'docs/**'
            shared_impact:
              - '.github/workflows/**'
              - 'infra/.github/workflows/**'
              - 'infra/scripts/**'
              - 'infra/Dockerfile*'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'backend/requirements*.txt'
              - 'backend/pytest.ini'
              - 'backend/.flake8'

  frontend-lane-check:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.frontend_lane == 'true' || needs.changed-paths.outputs.shared_impact == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend page exports
        run: |
          echo "Frontend lane active; running frontend lane checks only unless shared-impact is true."

  backend-lane-checks:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.backend_lane == 'true' || needs.changed-paths.outputs.shared_impact == 'true'
    strategy:
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Validate architecture artifact versions
        if: needs.changed-paths.outputs.shared_impact == 'true'
        working-directory: .
        run: |
          python infra/scripts/validate_architecture_version.py
      - name: Debug flake8 configuration
        working-directory: .
        env:
          PYTHONPATH: backend/src
        run: |
          python -c "from pathlib import Path; p=Path('backend/.flake8').resolve(); print(f'flake8 config: {p}'); print('exists=', p.exists())"
          sed -n '1,200p' backend/.flake8
          echo "Tracked python files under lint roots:"
          git ls-files 'backend/src/*.py' 'backend/src/**/*.py' 'backend/migrations/*.py' 'backend/migrations/**/*.py' 'backend/tests/*.py' 'backend/tests/**/*.py' 'infra/scripts/*.py' 'infra/scripts/**/*.py' | sed -n '1,120p'
      - name: Lint with flake8
        working-directory: backend
        env:
          PYTHONPATH: src
        run: |
          # Job scope: this workflow job runs in backend/ and only lints backend paths
          # passed below (src and migrations).
          # The wrapper keeps raw flake8 output/exit code intact and prints a deduplicated
          # F821 summary so repeated parser output cannot mask unique files/symbols.
          bash ../infra/scripts/run_flake8_with_summary.sh /tmp/flake8.strict.log src migrations tests
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 src migrations tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        working-directory: backend
        env:
          PYTHONPATH: src
        run: |
          pytest tests

  evo-v-core-lane-check:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.evo_v_core_lane == 'true' || needs.changed-paths.outputs.shared_impact == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate evo-v-core lane routing
        run: |
          echo "evo-v-core lane active; reserved full matrix only when shared-impact is true."

  infra-lane-check:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.infra_lane == 'true' || needs.changed-paths.outputs.shared_impact == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate infra lane routing
        run: |
          echo "infra lane active; reserved full matrix only when shared-impact is true."

  docs-lane-check:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.docs_lane == 'true' || needs.changed-paths.outputs.shared_impact == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate docs lane routing
        run: |
          echo "docs lane active; reserved full matrix only when shared-impact is true."

name: Python Package

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt
    - name: Validate architecture artifact versions
      run: |
        python infra/scripts/validate_architecture_version.py
    - name: Debug flake8 configuration
      run: |
        python -c "from pathlib import Path; p=Path('.flake8').resolve(); print(f'flake8 config: {p}'); print('exists=', p.exists())"
        sed -n '1,200p' .flake8
        echo "Tracked python files under lint roots:"
        git ls-files 'backend/src/*.py' 'backend/src/**/*.py' 'backend/migrations/*.py' 'backend/migrations/**/*.py' 'tests/*.py' 'tests/**/*.py' 'infra/scripts/*.py' 'infra/scripts/**/*.py' | sed -n '1,120p'
    - name: Lint with flake8
      run: |
        # The wrapper keeps raw flake8 output/exit code intact and prints a deduplicated
        # F821 summary so repeated parser output cannot mask unique files/symbols.
        bash ../infra/scripts/run_flake8_with_summary.sh /tmp/flake8.strict.log src migrations
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src migrations --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

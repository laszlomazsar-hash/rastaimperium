name: Python Package

on:
  push:
    paths:
      - 'frontend/app/**/page.tsx'
      - 'backend/**/*.py'
      - 'evo-v-core/**/*.py'
      - 'evo-v-core/requirements*.txt'
      - 'infra/**'
      - 'infra/.github/workflows/python-package-conda.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      frontend_pages: ${{ steps.filter.outputs.frontend_pages }}
      backend_python: ${{ steps.filter.outputs.backend_python }}
      evo_v_core: ${{ steps.filter.outputs.evo_v_core }}
      shared_infra: ${{ steps.filter.outputs.shared_infra }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend_pages:
              - 'frontend/app/**/page.tsx'
            backend_python:
              - 'backend/**/*.py'
            evo_v_core:
              - 'evo-v-core/**'
            shared_infra:
              - 'infra/**'
              - 'infra/.github/workflows/**'
              - 'pyproject.toml'
              - 'requirements*.txt'

  frontend-lane-check:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.frontend_pages == 'true' || needs.changed-paths.outputs.shared_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend page exports
        run: |
          echo "Frontend page files changed; backend and evo-v Python checks are not required for this scope."

  backend-lane-checks:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.backend_python == 'true' || needs.changed-paths.outputs.shared_infra == 'true'
    strategy:
      max-parallel: 5
    env:
      # Keep enabled until 3 consecutive green runs confirm stable topology,
      # then gate behind CODEX_LINT_DIAGNOSTICS=1 or remove entirely.
      CODEX_LINT_DIAGNOSTICS: '1'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Lint topology diagnostics
        run: |
          echo "== git rev-parse HEAD =="
          git rev-parse HEAD | tee /tmp/ci_head.txt
          echo
          echo "== git show --name-only --oneline -n 1 =="
          git show --name-only --oneline -n 1 | tee /tmp/ci_show.txt
          echo
          echo "== find . -path '*codex/compliance.py' =="
          find . -path '*codex/compliance.py' | tee /tmp/ci_compliance_paths.txt
          {
            echo "## Lint topology diagnostics"
            echo
            echo '```text'
            echo "$ git rev-parse HEAD"
            cat /tmp/ci_head.txt
            echo
            echo "$ git show --name-only --oneline -n 1"
            cat /tmp/ci_show.txt
            echo
            echo "$ find . -path '*codex/compliance.py'"
            if [ -s /tmp/ci_compliance_paths.txt ]; then
              cat /tmp/ci_compliance_paths.txt
            else
              echo "(no matches)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pre-lint codex package root guard
        working-directory: .
        run: |
          python tools/check_codex_package_roots.py
      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Validate architecture artifact versions
        if: needs.changed-paths.outputs.shared_infra == 'true'
        working-directory: .
        run: |
          python infra/scripts/validate_architecture_version.py
      - name: Debug codex compliance import path
        working-directory: backend
        env:
          PYTHONPATH: backend/src
        run: |
          python -c "import codex.compliance; print(codex.compliance.__file__)"
          find . -path '*codex/compliance.py'
      - name: Lint backend/src with flake8
        working-directory: .
        env:
          PYTHONPATH: backend/src
        run: |
          bash infra/scripts/run_flake8_with_summary.sh /tmp/flake8.backend-src.strict.log backend/src
          flake8 backend/src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Lint tests with flake8
        working-directory: .
        env:
          PYTHONPATH: backend/src
        run: |
          bash infra/scripts/run_flake8_with_summary.sh /tmp/flake8.tests.strict.log tests
          flake8 tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Lint infra/scripts with flake8
        working-directory: .
        env:
          PYTHONPATH: backend/src
        run: |
          bash infra/scripts/run_flake8_with_summary.sh /tmp/flake8.infra-scripts.strict.log infra/scripts
          flake8 infra/scripts --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Lint tools with flake8
        working-directory: .
        env:
          PYTHONPATH: backend/src
        run: |
          bash infra/scripts/run_flake8_with_summary.sh /tmp/flake8.tools.strict.log tools
          flake8 tools --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        working-directory: backend
        env:
          PYTHONPATH: src
        run: |
          pytest tests

  evo-v-core-checks:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.evo_v_core == 'true' || needs.changed-paths.outputs.shared_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Pre-lint codex package root guard
        working-directory: .
        run: |
          python tools/check_codex_package_roots.py
      - name: Install evo-v-core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r evo-v-core/requirements.txt
      - name: Run evo-v-core tests
        run: |
          pytest evo-v-core/tests
      - name: Lint evo-v-core/app with flake8
        run: |
          flake8 evo-v-core/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

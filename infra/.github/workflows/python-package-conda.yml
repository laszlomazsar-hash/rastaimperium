name: Python Package

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt
    - name: Validate architecture artifact versions
      run: |
        python infra/scripts/validate_architecture_version.py
    - name: Debug flake8 target and config
      run: |
        python -c "from pathlib import Path; p = Path('backend/.flake8').resolve(); print(f'flake8 config: {p}'); print(f'exists={p.exists()}')"
        sed -n '1,160p' backend/.flake8
        find . -type f -path '*/soulecho/v2.py' -print
    - name: Lint with flake8
      run: |
        FLAKE8_CONFIG=backend/.flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/src tests --config "${FLAKE8_CONFIG}" --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 backend/src tests --config "${FLAKE8_CONFIG}" --count --exit-zero --statistics
    - name: Test with pytest
      run: |
        pytest

name: Python Package

on:
  push:
    paths:
      - 'frontend/app/**/page.tsx'
      - 'backend/**/*.py'
      - 'evo-v-core/**/*.py'
      - 'evo-v-core/requirements*.txt'
      - 'infra/**'
      - 'infra/.github/workflows/python-package-conda.yml'
      - '.github/workflows/python-package-conda.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      frontend_pages: ${{ steps.filter.outputs.frontend_pages }}
      backend_python: ${{ steps.filter.outputs.backend_python }}
      evo_v_core: ${{ steps.filter.outputs.evo_v_core }}
      shared_infra: ${{ steps.filter.outputs.shared_infra }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend_pages:
              - 'frontend/app/**/page.tsx'
            backend_python:
              - 'backend/**/*.py'
            evo_v_core:
              - 'evo-v-core/**'
            shared_infra:
              - 'infra/**'
              - '.github/workflows/**'
              - 'pyproject.toml'
              - 'requirements*.txt'

  frontend-lane-check:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.frontend_pages == 'true' || needs.changed-paths.outputs.shared_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend page exports
        run: |
          echo "Frontend page files changed; backend and evo-v Python checks are not required for this scope."

  backend-lane-checks:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.backend_python == 'true' || needs.changed-paths.outputs.shared_infra == 'true'
    strategy:
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Validate architecture artifact versions
        if: needs.changed-paths.outputs.shared_infra == 'true'
        working-directory: .
        run: |
          python infra/scripts/validate_architecture_version.py
      - name: Lint Python domains with flake8
        env:
          PYTHONPATH: backend/src
        run: |
          echo "::group::flake8: backend/src"
          flake8 --config backend/.flake8 backend/src
          echo "::endgroup::"

          echo "::group::flake8: evo-v-core/app"
          flake8 evo-v-core/app
          echo "::endgroup::"

          echo "::group::flake8: frontend/app"
          flake8 frontend/app
          echo "::endgroup::"

          echo "::group::flake8: tests tools infra/scripts"
          flake8 tests tools infra/scripts
          echo "::endgroup::"
      - name: Test with pytest
        working-directory: backend
        env:
          PYTHONPATH: src
        run: |
          pytest tests

  evo-v-core-checks:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.evo_v_core == 'true' || needs.changed-paths.outputs.shared_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Install evo-v-core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r evo-v-core/requirements.txt
      - name: Run evo-v-core tests
        run: |
          pytest evo-v-core/tests

name: CI

on:
  pull_request:
    paths:
      - 'backend/src/**'
      - 'backend/requirements*.txt'
      - 'evo-v-core/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      core: ${{ steps.filter.outputs.core }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/src/**'
              - 'backend/requirements*.txt'
            core:
              - 'evo-v-core/**'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            tests:
              - 'tests/**'

  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Legacy runtime guard
        run: bash infra/scripts/check_legacy_runtime_reintroduction.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend lint deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Backend compile + lint
        working-directory: backend
        run: |
          python -m compileall src
          ruff check src

  core-ci:
    name: core-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.core == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core lint deps
        working-directory: evo-v-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Core compile + lint
        working-directory: evo-v-core
        run: |
          python -m compileall app
          ruff check app

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint

  tests-ci:
    name: tests-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.tests == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests domain
        working-directory: tests
        run: pytest

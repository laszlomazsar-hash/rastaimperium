name: CI

on:
  pull_request:
    paths:
      - 'backend/src/**'
      - 'backend/requirements*.txt'
      - 'evo-v-core/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      core: ${{ steps.filter.outputs.core }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/src/**'
              - 'backend/requirements*.txt'
            core:
              - 'evo-v-core/**'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            tests:
              - 'tests/**'

  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Legacy runtime guard
        run: bash infra/scripts/check_legacy_runtime_reintroduction.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose Python import path
        env:
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          import importlib
          import pprint
          import sys

          print("sys.path:")
          pprint.pp(sys.path)
          module = importlib.import_module("codex.compliance")
          print(f"codex.compliance module: {module.__file__}")
          PY

      - name: Install backend lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Backend compile + lint
        env:
          PYTHONPATH: backend/src
        run: |
          python -m compileall backend/src
          ruff check backend/src

  core-ci:
    name: core-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.core == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Core compile + lint
        run: |
          python -m compileall evo-v-core/app
          ruff check evo-v-core/app

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint

  tests-ci:
    name: tests-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.tests == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Diagnose Python import path
        env:
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          import importlib
          import pprint
          import sys

          print("sys.path:")
          pprint.pp(sys.path)
          module = importlib.import_module("codex.compliance")
          print(f"codex.compliance module: {module.__file__}")
          PY

      - name: Run tests domain
        env:
          PYTHONPATH: backend/src
        run: pytest tests

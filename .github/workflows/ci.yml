name: CI

on:
  pull_request:
    paths:
      - 'backend/src/**'
      - 'backend/requirements*.txt'
      - 'non-kernel/evo-v-core/**'
      - 'non-kernel/frontend/**'
      - 'non-kernel/package.json'
      - 'non-kernel/pnpm-lock.yaml'
      - 'tests/**'
      - 'scripts/**'
      - 'tools/**'
      - 'governance/**'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      core: ${{ steps.filter.outputs.core }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tests: ${{ steps.filter.outputs.tests }}
      changed_detection_failed: ${{ steps.detect_guard.outputs.changed_detection_failed }}
      backend: ${{ steps.detect.outputs.backend }}
      core: ${{ steps.detect.outputs.core }}
      frontend: ${{ steps.detect.outputs.frontend }}
      tests: ${{ steps.detect.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pre-filter ref synchronization
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune

      - name: Fetch full history for deterministic diff resolution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --unshallow || true
          fi
      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: filter
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/src/**'
              - 'backend/requirements*.txt'
            core:
              - 'non-kernel/evo-v-core/**'
            frontend:
              - 'non-kernel/frontend/**'
              - 'non-kernel/package.json'
              - 'non-kernel/pnpm-lock.yaml'
            tests:
              - 'tests/**'
      - id: detect
        name: Detect changed paths via guarded merge-base flow
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(git merge-base origin/main HEAD || true)"
          CHANGED_FILE_LIST="$(mktemp)"

          if [[ -n "${BASE}" ]]; then
            echo "Change detection mode: merge-base (${BASE}..HEAD)"
            git diff --name-only "${BASE}..HEAD" > "${CHANGED_FILE_LIST}"
          else
            echo "Change detection mode: fallback full-scan (no merge-base found)"
            cat <<'EOF' > "${CHANGED_FILE_LIST}"
backend/src/__fallback__.sentinel
evo-v-core/__fallback__.sentinel
frontend/__fallback__.sentinel
tests/__fallback__.sentinel
EOF

            echo "changed-paths fallback activated: no merge base; treating kernel scopes as changed." >> "$GITHUB_STEP_SUMMARY"
          fi

          if rg -q '^(backend/src/|backend/requirements.*\.txt$)' "${CHANGED_FILE_LIST}"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if rg -q '^non-kernel/evo-v-core/' "${CHANGED_FILE_LIST}"; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi

          if rg -q '^(non-kernel/frontend/|non-kernel/package\.json$|non-kernel/pnpm-lock\.yaml$)' "${CHANGED_FILE_LIST}"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if rg -q '^tests/' "${CHANGED_FILE_LIST}"; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi

      - id: detect_guard
        name: Record changed-path detection fallback state
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.filter.outcome }}" == "failure" ]]; then
            echo "changed_detection_failed=true" >> "$GITHUB_OUTPUT"
            echo "changed-path detection failed; fallback mode will run kernel validation defensively." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed_detection_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changed-path detection fallback notice
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.detect_guard.outputs.changed_detection_failed }}" == "true" ]]; then
            echo "::warning::Changed-path detection failed in changed-paths job; kernel validation will run in fallback mode."
            echo "Fallback mode reason: dorny/paths-filter step outcome was '${{ steps.filter.outcome }}'." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Changed-path detection succeeded; fallback mode not required." >> "$GITHUB_STEP_SUMMARY"
          fi


  governance-policy-ci:
    name: governance-policy-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify policy IR determinism and freshness
        run: bash tools/check-policy-consistency
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.backend == 'true'
    env:
      PYTHONPATH: backend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Legacy runtime guard
        run: bash infra/scripts/check_legacy_runtime_reintroduction.sh

      - name: Import policy guard
        run: python scripts/check_import_policies.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose Python import path
        env:
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          import importlib
          import pprint
          import sys

          print("sys.path:")
          pprint.pp(sys.path)
          module = importlib.import_module("codex.compliance")
          print(f"codex.compliance module: {module.__file__}")
          PY

      - name: Install backend lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Backend compile + lint
        env:
          PYTHONPATH: backend/src
        run: |
          python -m compileall backend/src
          ruff check backend/src

  core-ci:
    name: core-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.core == 'true' || needs.changed-paths.outputs.changed_detection_failed == 'true'
    env:
      PYTHONPATH: backend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Core compile + lint
        run: |
          python -m compileall non-kernel/evo-v-core/app
          ruff check non-kernel/evo-v-core/app

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint

  tests-ci:
    name: tests-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.tests == 'true'
    env:
      PYTHONPATH: backend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Import policy guard
        run: python scripts/check_import_policies.py

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Diagnose Python import path
        env:
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          import importlib
          import pprint
          import sys

          print("sys.path:")
          pprint.pp(sys.path)
          module = importlib.import_module("codex.compliance")
          print(f"codex.compliance module: {module.__file__}")
          PY
          python -m pip install pytest

      - name: Run architecture enforcement
        run: |
          python infra/scripts/validate_architecture_version.py
          pytest tests/test_architecture_version_validation.py tests/test_architecture_dependency_container_guard.py

      - name: Install full test deps
        if: success()
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests domain
        env:
          PYTHONPATH: backend/src
        run: pytest tests

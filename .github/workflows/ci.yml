name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.detect.outputs.any_changed }}
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Cargo.toml'
              - 'pyproject.toml'
              - 'requirements*.txt'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs/**'
              - '*.md'

  test-backend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.backend == 'true' || 
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
      - name: Run backend tests
        run: |
          echo "Running backend tests..."
          if command -v pytest > /dev/null; then pytest --tb=no; else echo "No tests found"; fi

  test-frontend:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.frontend == 'true' || 
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run frontend tests
        run: echo "Frontend tests would go here (e.g. npm test)"

  ci-status:
    needs: [test-backend, test-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Final status
        run: |
          if [[ "${{ needs.test-backend.result }}" == "failure" ]] || [[ "${{ needs.test-frontend.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "✅ CI passed or skipped cleanly"

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set_flags.outputs.backend }}
      core: ${{ steps.set_flags.outputs.core }}
      tests: ${{ steps.set_flags.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: set_flags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch --no-tags --prune --depth=1 origin "${BASE_REF}"
            DIFF_RANGE="origin/${BASE_REF}...HEAD"
          else
            BEFORE_SHA="${{ github.event.before }}"
            DIFF_RANGE="${BEFORE_SHA}...HEAD"
          fi

          CHANGED_FILES="$(git diff --name-only ${DIFF_RANGE})"
          echo "Changed files:"
          echo "${CHANGED_FILES}"

          backend=false
          core=false
          tests=false

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue

            if [[ "${file}" == backend/src/* ]]; then
              backend=true
            fi

            if [[ "${file}" == evo-v-core/* ]]; then
              core=true
            fi

            if [[ "${file}" == tests/* ]]; then
              tests=true
            fi
          done <<< "${CHANGED_FILES}"

          {
            echo "backend=${backend}"
            echo "core=${core}"
            echo "tests=${tests}"
          } >> "$GITHUB_OUTPUT"

  backend:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backend lint/test (scoped)
        run: |
          echo "Resolved compile targets: backend/src"
          python -m compileall backend/src

  core:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.core == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Core lint/test (scoped)
        run: |
          echo "Resolved compile targets: evo-v-core"
          python -m compileall evo-v-core

  tests:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.tests == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests domain checks (scoped)
        run: |
          echo "Resolved compile targets: tests"
          python -m compileall tests

  summary:
    runs-on: ubuntu-latest
    needs:
      - detect_changes
      - backend
      - core
      - tests
    if: always()
    steps:
      - name: CI summary
        run: |
          {
            echo "## CI Domain Execution Summary"
            echo ""
            echo "- backend changed: ${{ needs.detect_changes.outputs.backend }}"
            echo "- backend result: ${{ needs.backend.result }}"
            echo "- core changed: ${{ needs.detect_changes.outputs.core }}"
            echo "- core result: ${{ needs.core.result }}"
            echo "- tests changed: ${{ needs.detect_changes.outputs.tests }}"
            echo "- tests result: ${{ needs.tests.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

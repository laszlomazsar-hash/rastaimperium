name: CI

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'ledger/**'
      - 'governance/**'
      - 'tests/**'
      - 'docs/kernel/**'
      - 'scripts/**'
      - 'tools/**'
      - 'backend/src/**'
      - 'backend/requirements*.txt'
      - 'evo-v-core/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      kernel_runtime: ${{ steps.filter.outputs.kernel_runtime }}
      kernel_ledger: ${{ steps.filter.outputs.kernel_ledger }}
      kernel_governance: ${{ steps.filter.outputs.kernel_governance }}
      kernel_tests: ${{ steps.filter.outputs.kernel_tests }}
      kernel_docs: ${{ steps.filter.outputs.kernel_docs }}
      kernel_tools_scripts: ${{ steps.filter.outputs.kernel_tools_scripts }}
      kernel_any: ${{ steps.filter.outputs.kernel_any }}
      archival_core: ${{ steps.filter.outputs.archival_core }}
      archival_frontend: ${{ steps.filter.outputs.archival_frontend }}
      changed_detection_failed: ${{ steps.detect_guard.outputs.changed_detection_failed }}
      kernel_any_detect: ${{ steps.detect.outputs.kernel_any }}
      archival_core_detect: ${{ steps.detect.outputs.archival_core }}
      archival_frontend_detect: ${{ steps.detect.outputs.archival_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch full history for deterministic diff resolution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --unshallow || true
          fi
      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: filter
        continue-on-error: true
        uses: dorny/paths-filter@v3
        with:
          filters: |
            kernel_runtime:
              - 'runtime/**'
            kernel_ledger:
              - 'ledger/**'
            kernel_governance:
              - 'governance/**'
            kernel_tests:
              - 'tests/**'
            kernel_docs:
              - 'docs/kernel/**'
            kernel_tools_scripts:
              - 'tools/**'
              - 'scripts/**'
            kernel_any:
              - 'runtime/**'
              - 'ledger/**'
              - 'governance/**'
              - 'tests/**'
              - 'docs/kernel/**'
              - 'tools/**'
              - 'scripts/**'
            archival_core:
              - 'evo-v-core/**'
            archival_frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
      - id: detect
        name: Detect changed paths via guarded merge-base flow
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(git merge-base origin/main HEAD || true)"
          CHANGED_FILE_LIST="$(mktemp)"

          if [[ -n "${BASE}" ]]; then
            echo "Change detection mode: merge-base (${BASE}..HEAD)"
            git diff --name-only "${BASE}..HEAD" > "${CHANGED_FILE_LIST}"
          else
            echo "Change detection mode: fallback full-scan (no merge-base found)"
            cat <<'EOF' > "${CHANGED_FILE_LIST}"
runtime/__fallback__.sentinel
ledger/__fallback__.sentinel
governance/__fallback__.sentinel
tests/__fallback__.sentinel
tools/__fallback__.sentinel
scripts/__fallback__.sentinel
EOF
          fi

          if rg -q '^(runtime/|ledger/|governance/|tests/|docs/kernel/|tools/|scripts/)' "${CHANGED_FILE_LIST}"; then
            echo "kernel_any=true" >> "$GITHUB_OUTPUT"
          else
            echo "kernel_any=false" >> "$GITHUB_OUTPUT"
          fi

          if rg -q '^evo-v-core/' "${CHANGED_FILE_LIST}"; then
            echo "archival_core=true" >> "$GITHUB_OUTPUT"
          else
            echo "archival_core=false" >> "$GITHUB_OUTPUT"
          fi

          if rg -q '^(frontend/|package\.json$|pnpm-lock\.yaml$)' "${CHANGED_FILE_LIST}"; then
            echo "archival_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "archival_frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - id: detect_guard
        name: Record changed-path detection fallback state
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.filter.outcome }}" == "failure" ]]; then
            echo "changed_detection_failed=true" >> "$GITHUB_OUTPUT"
            echo "changed-path detection failed; fallback mode will run kernel validation defensively." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed_detection_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changed-path detection fallback notice
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.detect_guard.outputs.changed_detection_failed }}" == "true" ]]; then
            echo "::warning::Changed-path detection failed in changed-paths job; kernel validation will run in fallback mode."
            echo "Fallback mode reason: dorny/paths-filter step outcome was '${{ steps.filter.outcome }}'." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Changed-path detection succeeded; fallback mode not required." >> "$GITHUB_STEP_SUMMARY"
          fi


  kernel-governance-policy-ci:
    name: kernel-authoritative / governance policy CI
    runs-on: ubuntu-latest
    needs: changed-paths
    if: github.event_name == 'pull_request' && (needs.changed-paths.outputs.kernel_any == 'true' || needs.changed-paths.outputs.kernel_any_detect == 'true' || needs.changed-paths.outputs.changed_detection_failed == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify policy IR determinism and freshness
        run: bash tools/check-policy-consistency
  kernel-runtime-ci:
    name: kernel-authoritative / runtime CI
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.kernel_any == 'true' || needs.changed-paths.outputs.kernel_any_detect == 'true' || needs.changed-paths.outputs.changed_detection_failed == 'true'
    env:
      PYTHONPATH: backend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Legacy runtime guard
        run: bash infra/scripts/check_legacy_runtime_reintroduction.sh

      - name: Import policy guard
        run: python scripts/check_import_policies.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose Python import path
        env:
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          import importlib
          import pprint
          import sys

          print("sys.path:")
          pprint.pp(sys.path)
          module = importlib.import_module("codex.compliance")
          print(f"codex.compliance module: {module.__file__}")
          PY

      - name: Install backend lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Backend compile + lint
        env:
          PYTHONPATH: backend/src
        run: |
          python -m compileall backend/src
          ruff check backend/src

  archival-core-ci:
    name: non-kernel archival / evo-v core CI (non-blocking)
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.archival_core == 'true' || needs.changed-paths.outputs.archival_core_detect == 'true'
    continue-on-error: true
    env:
      PYTHONPATH: backend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Core compile + lint
        run: |
          python -m compileall evo-v-core/app
          ruff check evo-v-core/app

  archival-frontend-ci:
    name: non-kernel archival / frontend CI (non-blocking)
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.archival_frontend == 'true' || needs.changed-paths.outputs.archival_frontend_detect == 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint

  kernel-tests-ci:
    name: kernel-authoritative / tests CI
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.kernel_any == 'true' || needs.changed-paths.outputs.kernel_any_detect == 'true' || needs.changed-paths.outputs.changed_detection_failed == 'true'
    env:
      PYTHONPATH: backend/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Print and verify commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          echo "Resolved HEAD SHA: $CHECKED_OUT_SHA"
          echo "Expected PR/event SHA: $EXPECTED_SHA"
          echo "Expected PR/event ref: $EXPECTED_REF"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub head ref: ${GITHUB_HEAD_REF:-}"
          if [[ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Mismatch: checked-out SHA does not match event payload SHA" >&2
            exit 1
          fi

          {
            echo "### Commit identity"
            echo
            echo "- Resolved HEAD SHA: \\`$CHECKED_OUT_SHA\\`"
            echo "- Expected SHA (event payload): \\`$EXPECTED_SHA\\`"
            echo "- Expected ref (event payload): \\`$EXPECTED_REF\\`"
            echo "- GitHub ref: \\`$GITHUB_REF\\`"
            echo "- GitHub ref name: \\`$GITHUB_REF_NAME\\`"
            echo "- GitHub head ref: \\`${GITHUB_HEAD_REF:-}\\`"
            echo "- Local compare command: \\`git rev-parse HEAD\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Import policy guard
        run: python scripts/check_import_policies.py

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Diagnose Python import path
        env:
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          import importlib
          import pprint
          import sys

          print("sys.path:")
          pprint.pp(sys.path)
          module = importlib.import_module("codex.compliance")
          print(f"codex.compliance module: {module.__file__}")
          PY
          python -m pip install pytest

      - name: Run architecture enforcement
        run: |
          python infra/scripts/validate_architecture_version.py
          pytest tests/test_architecture_version_validation.py tests/test_architecture_dependency_container_guard.py

      - name: Install full test deps
        if: success()
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests domain
        env:
          PYTHONPATH: backend/src
        run: pytest tests

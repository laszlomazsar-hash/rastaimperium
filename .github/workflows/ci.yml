name: CI

on:
  pull_request:
    paths:
      - 'backend/src/**'
      - 'backend/requirements*.txt'
      - 'evo-v-core/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      core: ${{ steps.filter.outputs.core }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/src/**'
              - 'backend/requirements*.txt'
            core:
              - 'evo-v-core/**'
            frontend:
              - 'frontend/**'
            tests:
              - 'tests/**'

  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend lint deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Backend compile + lint
        working-directory: backend
        run: |
          python -m compileall src
          ruff check src

  core-ci:
    name: core-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.core == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core lint deps
        working-directory: evo-v-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Core compile + lint
        working-directory: evo-v-core
        run: |
          python -m compileall app
          ruff check app

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint

  tests-ci:
    name: tests-ci
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.tests == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests domain
        working-directory: tests
        run: pytest

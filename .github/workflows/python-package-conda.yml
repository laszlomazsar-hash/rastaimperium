name: Python Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'docs/**'
      - 'backend/**'
      - 'non-kernel/evo-v-core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/python-package-conda.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'docs/**'
      - 'backend/**'
      - 'non-kernel/evo-v-core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/python-package-conda.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/src
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt
    - name: Validate architecture artifact versions
      run: |
        python infra/scripts/validate_architecture_version.py
    - name: Diagnose Python import path
      env:
        PYTHONPATH: backend/src
      run: |
        python - <<'PY'
        import os
        import pprint
        import sys
        import traceback

        print("Validating codex import contract (codex.compliance must resolve from backend/src)")
        print("sys.path:")
        pprint.pp(sys.path)

        try:
            import codex.compliance as compliance
        except Exception:
            traceback.print_exc()
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                summary.write("- Import contract failed for `codex.compliance`; likely causes: circular import or shim inversion.\n")
            raise

        print(f"codex.compliance module: {compliance.__file__}")
        PY
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/src non-kernel/evo-v-core/app --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 backend/src non-kernel/evo-v-core/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Enforce certification profile guardrails
      env:
        PYTHONPATH: backend/src
      run: |
        pytest tests/test_compliance.py -k "profile_c or certification"
    - name: Test with pytest
      env:
        PYTHONPATH: backend/src
      run: |
        pytest tests

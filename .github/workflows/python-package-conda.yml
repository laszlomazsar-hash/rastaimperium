name: Python Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'src/**'
      - 'governance/**'
      - 'tests/test_compliance.py'
      - 'tests/test_deterministic_policy.py'
      - 'tests/test_canonical_json.py'
      - 'tests/test_canonical_hashing.py'
      - 'tests/test_governance_transition_matrix.py'
      - 'tests/test_governance_replayability.py'
      - 'tests/test_topology_atomic_commit.py'
      - 'tests/test_topology_transaction.py'
      - 'infra/scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/python-package-conda.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'src/**'
      - 'governance/**'
      - 'tests/test_compliance.py'
      - 'tests/test_deterministic_policy.py'
      - 'tests/test_canonical_json.py'
      - 'tests/test_canonical_hashing.py'
      - 'tests/test_governance_transition_matrix.py'
      - 'tests/test_governance_replayability.py'
      - 'tests/test_topology_atomic_commit.py'
      - 'tests/test_topology_transaction.py'
      - 'infra/scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/python-package-conda.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      # Root src/ (src.governance.fsm, src.codex) + backend/src (codex.compliance)
      PYTHONPATH: .:backend/src
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt
    - name: Validate architecture artifact versions
      run: |
        python infra/scripts/validate_architecture_version.py
    - name: Diagnose Python import path
      env:
        PYTHONPATH: .:backend/src
      run: |
        python - <<'PY'
        import importlib
        import os
        import pprint
        import sys
        import traceback

        print("Validating import contracts")
        print("sys.path:")
        pprint.pp(sys.path)

        print("Sub-step: importlib.import_module('codex.compliance')")
        try:
            compliance = importlib.import_module("codex.compliance")
        except Exception as exc:
            traceback.print_exc()
            message = f"{type(exc).__name__}: {exc}".lower()
            likely_cause = "circular import" if "circular" in message or "partially initialized module" in message else "shim inversion"
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                summary.write(
                    f"- Import contract failed for `codex.compliance` "
                    f"({type(exc).__name__}: {exc}); likely cause category: {likely_cause}.\n"
                )
            raise SystemExit(1)

        print(f"codex.compliance module: {compliance.__file__}")

        print("Sub-step: importlib.import_module('src.governance.fsm.transition_matrix')")
        fsm = importlib.import_module("src.governance.fsm.transition_matrix")
        print(f"src.governance.fsm.transition_matrix module: {fsm.__file__}")
        PY
    - name: Lint with flake8
      run: |
        flake8 backend/src --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Enforce certification profile guardrails
      env:
        PYTHONPATH: .:backend/src
      run: |
        pytest tests/test_compliance.py

    - name: Run required kernel/core test subset
      env:
        PYTHONPATH: .:backend/src
      run: |
        pytest \
          tests/test_deterministic_policy.py \
          tests/test_canonical_json.py \
          tests/test_canonical_hashing.py \
          tests/test_governance_transition_matrix.py \
          tests/test_governance_replayability.py \
          tests/test_topology_atomic_commit.py \
          tests/test_topology_transaction.py

    - name: Run optional legacy/non-kernel compatibility suite
      continue-on-error: true
      env:
        PYTHONPATH: .:backend/src
      run: |
        pytest tests \
          --ignore=tests/test_compliance.py \
          --ignore=tests/test_deterministic_policy.py \
          --ignore=tests/test_canonical_json.py \
          --ignore=tests/test_canonical_hashing.py \
          --ignore=tests/test_governance_transition_matrix.py \
          --ignore=tests/test_governance_replayability.py \
          --ignore=tests/test_topology_atomic_commit.py \
          --ignore=tests/test_topology_transaction.py

name: Python Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'evo-v-core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/python-package-conda.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'evo-v-core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/python-package-conda.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt
    - name: Validate architecture artifact versions
      run: |
        python infra/scripts/validate_architecture_version.py
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/src evo-v-core/app --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 backend/src evo-v-core/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Enforce certification profile guardrails
      run: |
        pytest tests/test_compliance.py -k "profile_c or certification"
    - name: Test with pytest
      run: |
        pytest

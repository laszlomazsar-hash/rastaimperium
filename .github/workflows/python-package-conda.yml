name: Python Package

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'docs/**'
      - 'backend/**'
      - 'non-kernel/evo-v-core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/python-package-conda.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'docs/**'
      - 'backend/**'
      - 'non-kernel/evo-v-core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/python-package-conda.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/src
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt
    - name: Validate architecture artifact versions
      run: |
        python infra/scripts/validate_architecture_version.py
    - name: Diagnose Python import path
      env:
        PYTHONPATH: backend/src
      run: |
        python - <<'PY'
        import importlib
        import pprint
        import sys

        print("sys.path:")
        pprint.pp(sys.path)
        module = importlib.import_module("codex.compliance")
        print(f"codex.compliance module: {module.__file__}")
        PY
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/src non-kernel/evo-v-core/app --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 backend/src non-kernel/evo-v-core/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Enforce certification profile guardrails
      env:
        PYTHONPATH: backend/src
      run: |
        pytest tests/test_compliance.py -k "profile_c or certification"
    - name: Publish required core test scope
      id: required-scope
      run: |
        {
          echo "scope<<EOF"
          echo 'tests/test_compliance.py -k "profile_c or certification"'
          echo "tests/test_deterministic_policy.py"
          echo "tests/test_canonical_json.py"
          echo "tests/test_canonical_hashing.py"
          echo "tests/test_governance_transition_matrix.py"
          echo "tests/test_governance_replayability.py"
          echo "tests/test_topology_atomic_commit.py"
          echo "tests/test_topology_transaction.py"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Run required kernel/core test subset
      env:
        PYTHONPATH: backend/src
      run: |
        # Required checks are limited to deterministic kernel/core governance coverage
        # so branch protection remains stable after repository split.
        pytest \
          tests/test_deterministic_policy.py \
          tests/test_canonical_json.py \
          tests/test_canonical_hashing.py \
          tests/test_governance_transition_matrix.py \
          tests/test_governance_replayability.py \
          tests/test_topology_atomic_commit.py \
          tests/test_topology_transaction.py

    - name: Publish optional compatibility test scope
      id: optional-scope
      run: |
        {
          echo "scope<<EOF"
          echo "tests/ (excluding required kernel/core subset)"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Run optional legacy/non-kernel compatibility suite
      continue-on-error: true
      env:
        PYTHONPATH: backend/src
      run: |
        # Legacy/non-kernel compatibility coverage is kept separate and non-blocking
        # to avoid destabilizing required checks during repository split migration.
        pytest tests \
          --ignore=tests/test_compliance.py \
          --ignore=tests/test_deterministic_policy.py \
          --ignore=tests/test_canonical_json.py \
          --ignore=tests/test_canonical_hashing.py \
          --ignore=tests/test_governance_transition_matrix.py \
          --ignore=tests/test_governance_replayability.py \
          --ignore=tests/test_topology_atomic_commit.py \
          --ignore=tests/test_topology_transaction.py

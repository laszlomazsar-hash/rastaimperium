name: build-linux

on:
  push:
    paths:
      - 'runtime/**'
      - 'ledger/**'
      - 'governance/**'
      - 'src/codex/**'
      - 'src/governance/**'
      - 'tests/architecture/**'
      - 'scripts/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'ledger/**'
      - 'governance/**'
      - 'src/codex/**'
      - 'src/governance/**'
      - 'tests/architecture/**'
      - 'scripts/**'
      - '.github/workflows/build-linux.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt-in now (prevents future break)
      PYTHONPATH: backend/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Legacy runtime guard
        run: bash infra/scripts/check_legacy_runtime_reintroduction.sh

      - name: Import policy guard
        run: python scripts/check_import_policies.py

      - name: Setup Python
        uses: actions/setup-python@v5   # ✅ FIXED (was v3)
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Diagnose Python import path
        env:
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          import pprint
          import sys
          import os
          import traceback

          print("Validating codex import contract (codex.compliance must resolve from backend/src)")
          print("sys.path:")
          pprint.pp(sys.path)

          try:
              import codex.compliance as compliance
          except Exception:
              traceback.print_exc()
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("- Import contract failed for `codex.compliance`; likely causes: circular import or shim inversion.\n")
              raise

          print(f"codex.compliance module: {compliance.__file__}")
          PY

      - name: Run tests
        env:
          PYTHONPATH: backend/src
        run: |
          pytest tests || exit 1   # forces explicit failure signal

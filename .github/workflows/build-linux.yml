name: build-linux

on:
  push:
    paths:
      - 'backend/**'
      - 'evo-v-core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/build-linux.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'evo-v-core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/build-linux.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt-in now (prevents future break)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Legacy runtime guard
        run: bash infra/scripts/check_legacy_runtime_reintroduction.sh

      - name: Import policy guard
        run: python scripts/check_import_policies.py

      - name: Setup Python
        uses: actions/setup-python@v5   # ✅ FIXED (was v3)
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest || exit 1   # forces explicit failure signal

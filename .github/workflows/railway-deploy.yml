name: Railway Deploy

# Railway's native GitHub integration deploys the connected production service
# from main. This workflow is intentionally manual-only so it cannot create a
# second, ambiguous deployment path when the project contains multiple services.

on:
  workflow_dispatch:

jobs:
  deployment-note:
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment source
        run: |
          echo "Railway native GitHub integration owns production deployment."
          echo "Use the Railway project deployment panel to redeploy or inspect logs."

name: Railway Deploy

# Manual force-redeploy + automatic chain after Build Static Site succeeds.
# Primary automated path is now the railway-redeploy job inside
# build-static-site.yml. This workflow remains for:
#   - workflow_dispatch force-redeploy with optional service override
#   - workflow_run backup if the in-workflow CLI step was skipped
#
# Multi-service projects MUST set secrets.RAILWAY_SERVICE or pass the
# service input — otherwise `railway up` fails with:
#   Multiple services found. Please specify a service via the `--service` flag.

on:
  workflow_run:
    workflows: ["Build Static Site"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Railway service name (required if project has multiple services)"
        required: false
        type: string
      environment:
        description: "Railway environment name"
        required: false
        default: production
        type: string

concurrency:
  group: railway-deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Skip failed static builds; always allow manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ inputs.environment || secrets.RAILWAY_ENVIRONMENT || 'production' }}
          INPUT_SERVICE: ${{ inputs.service }}
          SECRET_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error title=Missing Railway token::Set the RAILWAY_TOKEN GitHub Actions secret."
              exit 1
            fi
            echo "::notice title=Railway CLI skipped::RAILWAY_TOKEN not set; relying on Railway native GitHub integration."
            exit 0
          fi

          SERVICE="${INPUT_SERVICE:-${SECRET_SERVICE:-}}"
          ENVIRONMENT="${RAILWAY_ENVIRONMENT}"

          if [ -n "$SERVICE" ]; then
            echo "Deploying service='${SERVICE}' environment='${ENVIRONMENT}'"
            
            # Validate service exists before attempting deploy
            if ! railway service list --environment "${ENVIRONMENT}" 2>/dev/null | grep -q "^${SERVICE}"; then
              echo "::error title=Service not found::Service '${SERVICE}' not found in Railway environment '${ENVIRONMENT}'."
              echo ""
              echo "Current project topology:"
              railway service list --environment "${ENVIRONMENT}" 2>/dev/null || {
                echo "  (Failed to query services. Verify RAILWAY_TOKEN has project access.)"
              }
              echo ""
              echo "Expected service topology for Rasta Imperium:"
              echo "  Project: Rasta Imperium"
              echo "  Environment: production"
              echo "  Service name: web"
              echo ""
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                echo "To fix:"
                echo "  1. Set RAILWAY_SERVICE to 'web' in repository secrets, OR"
                echo "  2. Pass service='web' when running this workflow manually"
              else
                echo "To fix: Set RAILWAY_SERVICE = 'web' in Settings → Secrets and variables → Actions"
              fi
              exit 1
            fi
            
            railway up --ci --service "${SERVICE}" --environment "${ENVIRONMENT}"
          else
            echo "No service specified (input or RAILWAY_SERVICE secret). Attempting project default…"
            set +e
            railway up --ci --environment "${ENVIRONMENT}"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "::error title=Service required::Railway project has multiple services. Re-run with the service input, or set the RAILWAY_SERVICE repository secret to 'web'."
              exit 1
            fi
          fi

          echo "Railway CLI deploy submitted."


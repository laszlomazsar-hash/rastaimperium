name: Railway Deploy (Manual Force-Redeploy)

# Manual-only emergency redeploy mechanism for production service.
# 
# Normal production deployments are handled by Railway's native GitHub integration:
#   GitHub main commit → Railway detects push → builds & deploys to web/production
#
# This workflow is for emergency situations only:
#   - Force redeploy current commit without code changes
#   - Override service/environment for testing (with explicit workflow_dispatch inputs)
#
# Requires:
#   - RAILWAY_TOKEN GitHub secret (for CLI access)
#   - Manually triggered via workflow_dispatch (never automatic)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Railway service name (default: web)"
        required: false
        type: string
        default: "web"
      environment:
        description: "Railway environment name (default: production)"
        required: false
        type: string
        default: "production"

concurrency:
  group: railway-manual-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway (manual force-redeploy)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ inputs.environment }}
          RAILWAY_SERVICE: ${{ inputs.service }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error title=Missing Railway token::Set the RAILWAY_TOKEN GitHub Actions secret to enable manual redeploy."
            exit 1
          fi

          SERVICE="${RAILWAY_SERVICE}"
          ENVIRONMENT="${RAILWAY_ENVIRONMENT}"
          COMMIT="$(git rev-parse --short HEAD)"

          echo "Manual force-redeploy: service='${SERVICE}' environment='${ENVIRONMENT}' commit='${COMMIT}'"

          # Validate service exists before attempting deploy
          if ! railway service list --environment "${ENVIRONMENT}" 2>/dev/null | grep -q "^${SERVICE}"; then
            echo "::error title=Service not found::Service '${SERVICE}' not found in Railway environment '${ENVIRONMENT}'."
            echo ""
            echo "Available services:"
            railway service list --environment "${ENVIRONMENT}" 2>/dev/null || {
              echo "  (Failed to query services. Verify RAILWAY_TOKEN has project access.)"
            }
            exit 1
          fi

          railway up --ci --service "${SERVICE}" --environment "${ENVIRONMENT}"
          echo "Railway CLI force-redeploy submitted."


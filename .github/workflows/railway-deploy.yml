name: Railway Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'backend/static/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'railway.json'
      - '.github/workflows/railway-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: production
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error title=Missing Railway token::Set the RAILWAY_TOKEN GitHub Actions secret to a valid Railway project token."
            exit 1
          fi

          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error title=Missing Railway service::Set the RAILWAY_SERVICE GitHub Actions secret to the exact Railway service name (for example: Rasta Imperium)."
            exit 1
          fi

          railway up --ci --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT"

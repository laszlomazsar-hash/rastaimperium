name: Deploy static frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/app/**/page.tsx'
      - 'infra/**'
      - 'infra/.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changed-paths:
    runs-on: ubuntu-latest
    outputs:
      frontend_pages: ${{ steps.detect.outputs.frontend_pages }}
      shared_infra: ${{ steps.detect.outputs.shared_infra }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch full history for deterministic diff resolution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --unshallow || true
          fi
      - id: detect
        name: Detect changed paths via guarded merge-base flow
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(git merge-base origin/main HEAD || true)"
          CHANGED_FILE_LIST="$(mktemp)"

          if [[ -n "${BASE}" ]]; then
            echo "Change detection mode: merge-base (${BASE}..HEAD)"
            git diff --name-only "${BASE}..HEAD" > "${CHANGED_FILE_LIST}"
          else
            echo "Change detection mode: fallback full-scan (no merge-base found)"
            cat <<'EOF' > "${CHANGED_FILE_LIST}"
runtime/__fallback__.sentinel
ledger/__fallback__.sentinel
governance/__fallback__.sentinel
tests/__fallback__.sentinel
tools/__fallback__.sentinel
scripts/__fallback__.sentinel
EOF
          fi

          if rg -q '^frontend/app/.*/page\.tsx$' "${CHANGED_FILE_LIST}"; then
            echo "frontend_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_pages=false" >> "$GITHUB_OUTPUT"
          fi

          if rg -q '^(infra/|\.github/workflows/)' "${CHANGED_FILE_LIST}"; then
            echo "shared_infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "shared_infra=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: changed-paths
    if: needs.changed-paths.outputs.frontend_pages == 'true' || needs.changed-paths.outputs.shared_infra == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://your-render-service.onrender.com
        run: pnpm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

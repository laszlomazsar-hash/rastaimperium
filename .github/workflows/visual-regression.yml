name: Visual Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/static/**"
      - "non-kernel/frontend/**"
      - ".github/workflows/visual-regression.yml"
  push:
    branches: [main]
    paths:
      - "backend/static/**"
      - "non-kernel/frontend/**"
      - ".github/workflows/visual-regression.yml"
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate and commit approved screenshots for the current published static output"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: non-kernel/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: non-kernel/frontend
        run: npm ci --no-audit --no-fund

      - name: Ensure backend/static exists
        shell: bash
        run: |
          if [ ! -f backend/static/index.html ]; then
            echo "::error title=Missing static export::backend/static/index.html not found. Run Build Static Site first."
            exit 1
          fi
          echo "Static export present ($(wc -c < backend/static/index.html) bytes index.html)."

      - name: Locate or install Chromium
        id: chromium
        working-directory: non-kernel/frontend
        shell: bash
        run: |
          set -euo pipefail
          executable="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$executable" ]; then
            echo "System Chrome not found — installing Playwright Chromium…"
            npx playwright install chromium --with-deps
            executable="$(node -e "const {chromium}=require('@playwright/test'); process.stdout.write(chromium.executablePath())")"
          fi
          test -n "$executable"
          test -x "$executable" || test -f "$executable"
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
          echo "Using Chromium: $executable"

      - name: Run visual regression suite
        working-directory: non-kernel/frontend
        env:
          VISUAL_CHROMIUM_EXECUTABLE: ${{ steps.chromium.outputs.executable }}
        run: |
          if [ "${{ inputs.update_baselines }}" = "true" ]; then
            npm run test:visual:update
          else
            npm run test:visual
          fi

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: non-kernel/frontend/visual-regression/artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit approved baseline refresh
        if: github.event_name == 'workflow_dispatch' && inputs.update_baselines == true
        shell: bash
        run: |
          if test -z "$(git status --porcelain -- non-kernel/frontend/tests/visual-baselines)"; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add non-kernel/frontend/tests/visual-baselines
          git commit -m "test: refresh visual regression baselines"
          git push
